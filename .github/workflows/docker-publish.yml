name: Build and publish Docker image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/tradertavern:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # buildx pushes a provenance attestation manifest by default,
          # producing an OCI index with an "unknown/unknown" platform entry
          # that Watchtower (and some Docker versions) fail to resolve
          # against when checking for a new digest — disable it so the
          # registry only ever holds a plain single-platform image.
          provenance: false
