          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundamentalTickerDto'
      security:
        - cookie: []
      tags:
        - Finance
  /finance/ticker/{id}/chart:
    get:
      operationId: getTickerChart
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: window
          required: true
          in: query
          schema:
            type: string
            enum:
              - 5m
              - 1h
              - 1d
              - 1wk
      responses:
        '200':
          description: ''
          content:
            application/json:
