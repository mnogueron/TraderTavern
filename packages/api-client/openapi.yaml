openapi: 3.0.0
paths:
  /:
    get:
      operationId: getData
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /user:
    get:
      operationId: getUsers
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            minimum: 10
            default: 10
            type: number
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserDto'
      security:
        - cookie: []
      tags:
        - User
  /auth/register:
    post:
      operationId: register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      tags:
        - Auth
  /auth/login:
    post:
      operationId: login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      tags:
        - Auth
  /auth/logout:
    post:
      operationId: logout
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - cookie: []
      tags:
        - Auth
  /auth/reset-password:
    post:
      operationId: resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponseDto'
      tags:
        - Auth
  /auth/me:
    get:
      operationId: me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      security:
        - cookie: []
      tags:
        - Auth
  /finance/screener:
    get:
      operationId: getScreener
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TickerDto'
      security:
        - cookie: []
      tags:
        - Finance
  /finance/screener/filters/tickers:
    get:
      operationId: getScreenerTickerOptions
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TickerOptionDto'
      security:
        - cookie: []
      tags:
        - Finance
  /finance/sync:
    post:
      operationId: syncScreener
      parameters: []
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
        - Finance
  /finance/sync/fundamental:
    post:
      operationId: syncFundamental
      parameters: []
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
        - Finance
  /finance/sync/compound:
    post:
      operationId: syncCompound
      parameters: []
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
        - Finance
  /finance/sync/technical:
    post:
      operationId: syncTechnical
      parameters: []
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
        - Finance
  /finance/ticker/{id}/sync:
    post:
      operationId: syncSingleTicker
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
        - Finance
  /finance/ticker/{id}/sync/fundamental:
    post:
      operationId: syncSingleTickerFundamental
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
        - Finance
  /finance/ticker/{id}/sync/compound:
    post:
      operationId: syncSingleTickerCompound
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
        - Finance
  /finance/ticker/{id}/sync/technical:
    post:
      operationId: syncSingleTickerTechnical
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
        - Finance
  /finance/ticker/{id}:
    get:
      operationId: getTicker
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerDto'
      security:
        - cookie: []
      tags:
        - Finance
  /finance/ticker/{id}/fundamental:
    get:
      operationId: getTickerFundamental
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundamentalTickerDto'
      security:
        - cookie: []
      tags:
        - Finance
  /finance/ticker/{id}/chart:
    get:
      operationId: getTickerChart
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: window
          required: true
          in: query
          schema:
            type: string
            enum:
              - 5m
              - 1h
              - 1d
              - 1wk
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerChartDto'
      security:
        - cookie: []
      tags:
        - Finance
  /finance/ticker/{id}/market-hours:
    get:
      operationId: getTickerMarketHours
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketHoursDto'
      security:
        - cookie: []
      tags:
        - Finance
info:
  title: TraderTavern API
  description: The TraderTavern API documentation
  version: '0.1'
  contact: {}
tags: []
servers: []
components:
  schemas:
    UserDto:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
      required:
        - id
        - username
        - email
        - role
    PaginationMetaDto:
      type: object
      properties:
        page:
          type: number
        size:
          type: number
        total:
          type: number
        totalPages:
          type: number
      required:
        - page
        - size
        - total
        - totalPages
    PaginatedUserDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDto'
        meta:
          $ref: '#/components/schemas/PaginationMetaDto'
      required:
        - data
        - meta
    RegisterDto:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - username
        - email
        - password
    LoginDto:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    ResetPasswordDto:
      type: object
      properties:
        email:
          type: string
        token:
          type: string
        newPassword:
          type: string
      required:
        - email
    ResetPasswordResponseDto:
      type: object
      properties:
        token:
          type: string
        success:
          type: boolean
    TickerDto:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: string
        sector:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        marketCap:
          type: number
          nullable: true
        peRatio:
          type: number
          nullable: true
        price:
          type: number
          nullable: true
        country:
          type: string
          nullable: true
        market:
          type: string
          nullable: true
          description: Display name of the market the ticker trades on
        currency:
          type: string
          nullable: true
          description: ISO 4217 currency code the ticker is priced in (e.g. USD, EUR)
        changePercent:
          type: number
          nullable: true
          description: >-
            Change since the last completed session close, in percent (e.g. 1.23
            for +1.23%). While the market is open this compares the last two
            completed closes; once the market has closed for the day it compares
            today's close to yesterday's.
        changePercent1w:
          type: number
          nullable: true
          description: 1 week change, in percent
        changePercent1m:
          type: number
          nullable: true
          description: 1 month change, in percent
        changePercent3m:
          type: number
          nullable: true
          description: 3 month change, in percent
        changePercent6m:
          type: number
          nullable: true
          description: 6 month change, in percent
        changePercentYtd:
          type: number
          nullable: true
          description: Year-to-date change, in percent
        changePercent1y:
          type: number
          nullable: true
          description: 1 year change, in percent
        refreshedAt:
          format: date-time
          type: string
          nullable: true
          description: When the underlying technical data was last refreshed
      required:
        - ticker
        - companyName
        - sector
        - industry
        - marketCap
        - peRatio
        - price
        - country
        - market
        - currency
        - changePercent
        - changePercent1w
        - changePercent1m
        - changePercent3m
        - changePercent6m
        - changePercentYtd
        - changePercent1y
        - refreshedAt
    TickerOptionDto:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: string
      required:
        - ticker
        - companyName
    FundamentalTickerDto:
      type: object
      properties:
        ticker:
          type: string
        marketCap:
          type: number
          nullable: true
        peRatio:
          type: number
          nullable: true
        psRatio:
          type: number
          nullable: true
        ebitda:
          type: number
          nullable: true
        totalDebt:
          type: number
          nullable: true
        debtToEquity:
          type: number
          nullable: true
        refreshedAt:
          format: date-time
          type: string
          nullable: true
          description: When this fundamental data was last refreshed
      required:
        - ticker
        - marketCap
        - peRatio
        - psRatio
        - ebitda
        - totalDebt
        - debtToEquity
        - refreshedAt
    CandleDto:
      type: object
      properties:
        startTime:
          format: date-time
          type: string
        endTime:
          format: date-time
          type: string
        entry:
          type: number
        exit:
          type: number
        low:
          type: number
        high:
          type: number
        volume:
          type: number
      required:
        - startTime
        - endTime
        - entry
        - exit
        - low
        - high
        - volume
    TickerChartDto:
      type: object
      properties:
        ticker:
          type: string
        window:
          type: string
          enum:
            - 5m
            - 1h
            - 1d
            - 1wk
        candles:
          type: array
          items:
            $ref: '#/components/schemas/CandleDto'
      required:
        - ticker
        - window
        - candles
    MarketHoursDto:
      type: object
      properties:
        market:
          type: string
        label:
          type: string
        timezone:
          type: string
          description: IANA timezone name, e.g. America/New_York
        preMarketOpen:
          type: string
          nullable: true
          description: HH:mm, local to timezone
        regularOpen:
          type: string
          description: HH:mm, local to timezone
        regularClose:
          type: string
          description: HH:mm, local to timezone
        postMarketClose:
          type: string
          nullable: true
          description: HH:mm, local to timezone
      required:
        - market
        - label
        - timezone
        - preMarketOpen
        - regularOpen
        - regularClose
        - postMarketClose
