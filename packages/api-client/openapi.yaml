      security:
        - cookie: []
      tags:
        - Finance
  /finance/sync:
    post:
      operationId: syncScreener
      parameters: []
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
        - Finance
  /finance/sync/static:
    post:
      operationId: syncStatic
      parameters: []
      responses:
        '204':
          description: ''
      security:
