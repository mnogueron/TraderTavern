      operationId: syncCompound
      parameters: []
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
        - Finance
  /finance/sync/technical:
    post:
      operationId: syncTechnical
      parameters: []
      responses:
        '204':
          description: ''
      security:
        - cookie: []
