  /finance/ticker/{id}/sync:
    post:
      operationId: syncSingleTicker
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security:
        - cookie: []
      tags:
