info:
  title: TraderTavern API
  description: The TraderTavern API documentation
  version: '0.1'
  contact: {}
tags: []
servers: []
components:
  schemas:
    UserDto:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
      required:
        - id
        - username
        - email
        - role
    PaginationMetaDto:
      type: object
      properties:
        page:
          type: number
        size:
          type: number
        total:
          type: number
        totalPages:
          type: number
      required:
        - page
        - size
        - total
        - totalPages
    PaginatedUserDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDto'
        meta:
          $ref: '#/components/schemas/PaginationMetaDto'
      required:
        - data
        - meta
    RegisterDto:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - username
        - email
        - password
    LoginDto:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    ResetPasswordDto:
      type: object
      properties:
        email:
          type: string
        token:
          type: string
        newPassword:
          type: string
      required:
        - email
    ResetPasswordResponseDto:
      type: object
      properties:
        token:
          type: string
        success:
          type: boolean
    TickerDto:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: string
        sector:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        marketCap:
          type: number
          nullable: true
        peRatio:
          type: number
          nullable: true
        price:
          type: number
          nullable: true
        country:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          description: Basic description of the company
        employees:
          type: number
          nullable: true
        fiscalYearEnd:
          format: date-time
          type: string
          nullable: true
        mostRecentQuarter:
          format: date-time
          type: string
          nullable: true
        market:
          type: string
          nullable: true
          description: Display name of the market the ticker trades on
        currency:
          type: string
          nullable: true
          description: ISO 4217 currency code the ticker is priced in (e.g. USD, EUR)
        changePercent:
          type: number
          nullable: true
          description: >-
            Change since the last completed session close, in percent (e.g. 1.23
            for +1.23%). While the market is open this compares the last two
            completed closes; once the market has closed for the day it compares
            today's close to yesterday's.
        changePercent1w:
          type: number
          nullable: true
          description: 1 week change, in percent
        changePercent1m:
          type: number
          nullable: true
          description: 1 month change, in percent
        changePercent3m:
          type: number
          nullable: true
          description: 3 month change, in percent
        changePercent6m:
          type: number
          nullable: true
          description: 6 month change, in percent
        changePercentYtd:
          type: number
          nullable: true
          description: Year-to-date change, in percent
        changePercent1y:
          type: number
          nullable: true
          description: 1 year change, in percent
        rsi14:
          type: number
          nullable: true
          description: RSI(14)
        macd:
          type: number
          nullable: true
          description: MACD(12,26,9) line
        macdSignal:
          type: number
          nullable: true
          description: MACD(12,26,9) signal line
        macdHistogram:
          type: number
          nullable: true
          description: MACD(12,26,9) histogram
        bbUpper:
          type: number
          nullable: true
          description: Bollinger Band(20,2) upper
        bbMiddle:
          type: number
          nullable: true
          description: Bollinger Band(20,2) middle
        bbLower:
          type: number
          nullable: true
          description: Bollinger Band(20,2) lower
        bbWidth:
          type: number
          nullable: true
          description: Bollinger Band width, in percent
        atr14:
          type: number
          nullable: true
          description: ATR(14)
        volumeRatio20d:
          type: number
          nullable: true
          description: 20 day volume ratio (latest volume / 20d avg volume)
        refreshedAt:
          format: date-time
          type: string
          nullable: true
          description: When the underlying technical data was last refreshed
      required:
        - ticker
        - companyName
        - sector
        - industry
        - marketCap
        - peRatio
        - price
        - country
        - description
        - employees
        - fiscalYearEnd
        - mostRecentQuarter
        - market
        - currency
        - changePercent
        - changePercent1w
        - changePercent1m
        - changePercent3m
        - changePercent6m
        - changePercentYtd
        - changePercent1y
        - rsi14
        - macd
        - macdSignal
        - macdHistogram
        - bbUpper
        - bbMiddle
        - bbLower
        - bbWidth
        - atr14
        - volumeRatio20d
        - refreshedAt
    TickerOptionDto:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: string
      required:
        - ticker
        - companyName
    FundamentalTickerDto:
      type: object
      properties:
        ticker:
          type: string
        marketCap:
          type: number
          nullable: true
        peRatio:
          type: number
          nullable: true
        psRatio:
          type: number
          nullable: true
        ebitda:
          type: number
          nullable: true
        totalDebt:
          type: number
          nullable: true
        debtToEquity:
          type: number
          nullable: true
        enterpriseValue:
          type: number
          nullable: true
        revenue:
          type: number
          nullable: true
          description: Revenue (TTM)
        grossProfit:
          type: number
          nullable: true
        netIncome:
          type: number
          nullable: true
          description: Net income (TTM)
        revenuePerShare:
          type: number
          nullable: true
        forwardPE:
          type: number
          nullable: true
        pegRatio:
          type: number
          nullable: true
        evToEbitda:
          type: number
          nullable: true
        evToRevenue:
          type: number
          nullable: true
        priceToBook:
          type: number
          nullable: true
        epsTrailing:
          type: number
          nullable: true
        epsForward:
          type: number
          nullable: true
        fiftyTwoWeekHigh:
          type: number
          nullable: true
        fiftyTwoWeekLow:
          type: number
          nullable: true
        grossMargin:
          type: number
          nullable: true
          description: In percent
        operatingMargin:
          type: number
          nullable: true
          description: In percent
        ebitdaMargin:
          type: number
          nullable: true
          description: In percent
        profitMargin:
          type: number
          nullable: true
          description: In percent
        returnOnEquity:
          type: number
          nullable: true
          description: In percent
        returnOnAssets:
          type: number
          nullable: true
          description: In percent
        revenueGrowth:
          type: number
          nullable: true
          description: In percent
        earningsGrowth:
          type: number
          nullable: true
          description: In percent
        operatingCashflow:
          type: number
          nullable: true
        capex:
          type: number
          nullable: true
          description: Capital expenditure (TTM)
        fcfMargin:
          type: number
          nullable: true
          description: In percent
        fcfYield:
          type: number
          nullable: true
          description: In percent
        netDebt:
          type: number
          nullable: true
        netDebtToEbitda:
          type: number
          nullable: true
        currentRatio:
          type: number
          nullable: true
        quickRatio:
          type: number
          nullable: true
        bookValuePerShare:
          type: number
          nullable: true
        cashPerShare:
          type: number
          nullable: true
        forwardDividendRate:
          type: number
          nullable: true
        trailingDividendRate:
          type: number
          nullable: true
        dividendYield:
          type: number
          nullable: true
          description: In percent
        fiveYearAvgDividendYield:
          type: number
          nullable: true
          description: In percent
        payoutRatio:
          type: number
          nullable: true
          description: In percent
        exDividendDate:
          format: date-time
          type: string
          nullable: true
        analystRating:
          type: string
          nullable: true
          description: e.g. "buy", "hold"
        analystTargetMean:
          type: number
          nullable: true
        analystTargetLow:
          type: number
          nullable: true
        analystTargetHigh:
          type: number
          nullable: true
        analystCount:
          type: number
          nullable: true
        sharesOutstanding:
          type: number
          nullable: true
        floatShares:
          type: number
          nullable: true
        insidersPercent:
          type: number
          nullable: true
          description: In percent
        institutionsPercent:
          type: number
          nullable: true
          description: In percent
        sma50:
          type: number
          nullable: true
        sma200:
          type: number
          nullable: true
        beta:
          type: number
          nullable: true
        sp500Change52w:
          type: number
          nullable: true
          description: S&P 500 52 week change, in percent
        avgVolume30d:
          type: number
          nullable: true
          description: 30 day average volume
        avgVolume10d:
          type: number
          nullable: true
          description: 10 day average volume
        refreshedAt:
          format: date-time
          type: string
          nullable: true
          description: When this fundamental data was last refreshed
      required:
        - ticker
        - marketCap
        - peRatio
        - psRatio
        - ebitda
        - totalDebt
        - debtToEquity
        - enterpriseValue
        - revenue
        - grossProfit
        - netIncome
        - revenuePerShare
        - forwardPE
        - pegRatio
        - evToEbitda
        - evToRevenue
        - priceToBook
        - epsTrailing
        - epsForward
        - fiftyTwoWeekHigh
        - fiftyTwoWeekLow
        - grossMargin
        - operatingMargin
        - ebitdaMargin
        - profitMargin
        - returnOnEquity
        - returnOnAssets
        - revenueGrowth
        - earningsGrowth
        - operatingCashflow
        - capex
        - fcfMargin
        - fcfYield
        - netDebt
        - netDebtToEbitda
        - currentRatio
        - quickRatio
        - bookValuePerShare
        - cashPerShare
        - forwardDividendRate
        - trailingDividendRate
        - dividendYield
        - fiveYearAvgDividendYield
        - payoutRatio
        - exDividendDate
        - analystRating
        - analystTargetMean
        - analystTargetLow
        - analystTargetHigh
        - analystCount
        - sharesOutstanding
        - floatShares
        - insidersPercent
        - institutionsPercent
        - sma50
        - sma200
        - beta
        - sp500Change52w
        - avgVolume30d
        - avgVolume10d
        - refreshedAt
    CandleDto:
      type: object
      properties:
        startTime:
          format: date-time
          type: string
        endTime:
          format: date-time
          type: string
        entry:
          type: number
        exit:
          type: number
        low:
          type: number
        high:
          type: number
        volume:
          type: number
      required:
        - startTime
        - endTime
        - entry
        - exit
        - low
        - high
        - volume
    TickerChartDto:
      type: object
      properties:
        ticker:
          type: string
        window:
          type: string
          enum:
            - 5m
            - 1h
            - 1d
            - 1wk
        candles:
          type: array
          items:
            $ref: '#/components/schemas/CandleDto'
      required:
        - ticker
        - window
        - candles
    MarketHoursDto:
      type: object
      properties:
        market:
          type: string
        label:
          type: string
        timezone:
          type: string
          description: IANA timezone name, e.g. America/New_York
        preMarketOpen:
          type: string
          nullable: true
          description: HH:mm, local to timezone
        regularOpen:
          type: string
          description: HH:mm, local to timezone
        regularClose:
          type: string
          description: HH:mm, local to timezone
        postMarketClose:
          type: string
          nullable: true
          description: HH:mm, local to timezone
      required:
        - market
        - label
        - timezone
        - preMarketOpen
        - regularOpen
        - regularClose
        - postMarketClose
