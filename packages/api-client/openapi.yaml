openapi: 3.0.0
paths:
  /:
    get:
      operationId: getData
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /user:
    get:
      operationId: getUsers
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            minimum: 10
            default: 10
            type: number
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserDto'
      security:
        - cookie: []
      tags:
        - User
  /auth/register:
    post:
      operationId: register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      tags:
        - Auth
  /auth/login:
    post:
      operationId: login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      tags:
        - Auth
  /auth/logout:
    post:
      operationId: logout
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - cookie: []
      tags:
        - Auth
  /auth/reset-password:
    post:
      operationId: resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponseDto'
      tags:
        - Auth
  /auth/me:
    get:
      operationId: me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      security:
        - cookie: []
      tags:
        - Auth
info:
  title: TraderTavern API
  description: The TraderTavern API documentation
  version: '0.1'
  contact: {}
tags: []
servers: []
components:
  schemas:
    UserDto:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
      required:
        - id
        - username
        - email
        - role
    PaginationMetaDto:
      type: object
      properties:
        page:
          type: number
        size:
          type: number
        total:
          type: number
        totalPages:
          type: number
      required:
        - page
        - size
        - total
        - totalPages
    PaginatedUserDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDto'
        meta:
          $ref: '#/components/schemas/PaginationMetaDto'
      required:
        - data
        - meta
    RegisterDto:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - username
        - email
        - password
    LoginDto:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    ResetPasswordDto:
      type: object
      properties:
        email:
          type: string
        token:
          type: string
        newPassword:
          type: string
      required:
        - email
    ResetPasswordResponseDto:
      type: object
      properties:
        token:
          type: string
        success:
          type: boolean
