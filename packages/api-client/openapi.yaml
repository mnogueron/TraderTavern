            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      tags:
        - Auth
  /auth/logout:
    post:
      operationId: logout
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - cookie: []
      tags:
        - Auth
  /auth/reset-password:
    post:
      operationId: resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponseDto'
      tags:
        - Auth
  /auth/me:
    get:
      operationId: me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      security:
        - cookie: []
      tags:
        - Auth
  /finance/screener:
